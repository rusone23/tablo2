<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Табло НХЛ</title>
<style>
:root{color-scheme:dark;--h:60px;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Roboto Condensed","Arial Narrow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:#fff;background:transparent}
body.ctl{background:#14161a;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
.sb{display:inline-block;margin:10px;filter:drop-shadow(0 2px 6px #0007)}
.r1{display:flex;height:var(--h)}
.lg,.lb{width:var(--h);background:#fff;display:flex;align-items:center;justify-content:center;padding:4px}
.lg img,.lb img{width:100%;height:100%;object-fit:contain}
.lb{background:#f4f4f4}
.cell{display:flex;align-items:center;gap:10px;padding:0 14px;font-weight:800;min-width:128px}
.ab{font-size:30px;letter-spacing:1px}
.s{font-size:40px;margin-left:auto;padding-left:6px}
.tm{background:#e9edf0;color:#111;min-width:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.tm b{font-size:30px;font-variant-numeric:tabular-nums}
.tm span{font-size:17px;font-weight:700;margin-top:3px}
.r2{display:flex;margin-top:3px}
.r2.a{padding-left:calc(var(--h)*2)}
.r2.b{justify-content:flex-end;padding-right:calc(var(--h) + 92px)}
.pp{padding:6px 14px;font-size:19px;font-weight:700;letter-spacing:.5px;display:flex;gap:10px;align-items:center}
.pp b{font-size:26px;font-variant-numeric:tabular-nums}
.wrap .sb{zoom:.6;margin:4px 0}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.card{background:#1f2329;border-radius:12px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-size:19px;font-weight:700;border:0;border-radius:10px;padding:14px 12px;background:#2d3340;color:#fff;flex:1}
button.big{font-size:30px;padding:18px}
button.g{background:#1b7f3b}button.r{background:#a02a2a}button.on{background:#2f6fd0}
input[type=text],select{font:inherit;font-size:18px;padding:10px;border-radius:8px;border:1px solid #444;background:#111;color:#fff;flex:1;min-width:0}
input[type=color]{width:48px;height:42px;border:0;background:none;padding:0}
.big2{font-size:52px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.msg{font-size:14px;opacity:.7;text-align:center;min-height:20px}
h2{margin:0 0 8px;font-size:15px;opacity:.7;font-weight:600}
a{color:#7ab7ff;word-break:break-all}
</style>
</head>

function left(){ var t=S.t, v = t.run ? t.base - (Date.now()-t.at)/1000 : t.base; return Math.max(0, Math.ceil(v)); }
function ppLeft(){ var p=S.pp; if(!p.team) return 0; var v = S.t.run ? p.base - (Date.now()-p.at)/1000 : p.base; return Math.max(0, Math.ceil(v)); }
function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
function fmtpp(s){ return s<60 ? ':'+String(s).padStart(2,'0') : Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function esc(x){ return String(x).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function tc(h){ var m=/^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(h); if(!m) return '#fff';
  var l=(0.299*parseInt(m[1],16)+0.587*parseInt(m[2],16)+0.114*parseInt(m[3],16)); return l>150 ? '#111' : '#fff'; }

function lbox(T){ var src = T.k==='own' ? LGD[T.lid] : LOGO[T.k]; return src ? '<div class="lb"><img src="'+src+'"></div>' : ''; }
function cell(T,k){
  var st='background:'+esc(T.c)+';color:'+tc(T.c);

}
function bar(){

  }
  return h + '</div>';
}

    var r = 'tablo-' + Math.random().toString(36).slice(2, 12);
    var base = location.origin + location.pathname + '?t=' + r;
    document.getElementById('out').innerHTML =
      '<p><b>Для трансляции (вставить в Prism):</b><br><a href="'+base+'">'+base+'</a></p>' +
      '<p><b>Пульт (открыть на втором телефоне):</b><br><a href="'+base+'#control">'+base+'#control</a></p>' +
      '<p>Сохраните обе ссылки. Любой, кто знает ссылку пульта, может менять счёт.</p>';
  };
}

function render(){
  if (!topic) { setup(); return; }
  if (!ctl) { root.innerHTML = bar(); return; }
  var pl = PL.map(function(x,i){ return '<button class="'+(S.p===i+1?'on':'')+'" data-a="p'+(i+1)+'">'+x+'</button>'; }).join('');
  root.innerHTML = '<div class="wrap">' + bar() + team('a') + team('b') +
    '<div class="card"><h2>Период</h2><div class="row">'+pl+'</div></div>' +
    '<div class="card"><h2>Время</h2><div class="big2 clk">'+fmt(left())+'</div>' +
    '<div class="row"><button class="'+(S.t.run?'r':'g')+'" data-a="go">'+(S.t.run?'Стоп':'Старт')+'</button></div>' +
    '<div class="row" style="margin-top:8px"><input type="text" id="tm" value="'+fmt(left())+'" inputmode="numeric"><button data-a="set">Задать</button></div></div>' +
    '<div class="card"><h2>Большинство (идёт вместе с игровым временем)</h2>' +
    '<div class="row"><input type="text" id="pd" value="2:00" inputmode="numeric" style="max-width:100px">' +
    '<button style="background:'+esc(S.a.c)+';color:'+tc(S.a.c)+'" data-a="ppa">'+esc(S.a.n)+'</button>' +
    '<button style="background:'+esc(S.b.c)+';color:'+tc(S.b.c)+'" data-a="ppb">'+esc(S.b.n)+'</button>' +
    '<button class="r" data-a="ppx">Убрать</button></div></div>' +
    '<div class="msg" id="msg">Связь: '+net+'</div></div>';
  root.querySelectorAll('button').forEach(function(b){ b.onclick = function(){ act(b.dataset.a); }; });
  ['a','b'].forEach(function(k){
    document.getElementById('n'+k).onchange = function(e){ S[k].n = e.target.value; send(); render(); };
    document.getElementById('c'+k).onchange = function(e){ S[k].c = e.target.value; send(); render(); };
    document.getElementById('f'+k).onchange = function(e){ upload(k, e.target.files[0]); };
    document.getElementById('k'+k).onchange = function(e){
      var v = e.target.value; S[k].k = v; if (PRE[v]) { S[k].n = PRE[v].n; S[k].c = PRE[v].c; } send(); render(); };
  });
}

function parseT(str){
  var m = str.split(':'); var v = m.length>1 ? (+m[0])*60 + (+m[1]) : (+m[0])*60;
  return isNaN(v) ? null : v;
}

function act(a){
  var n = Date.now();
  if (a==='upa' || a==='upb'){ document.getElementById('f'+a[2]).click(); return; }
  if (a==='a+') S.a.s++; else if (a==='a-') S.a.s=Math.max(0,S.a.s-1);
  else if (a==='b+') S.b.s++; else if (a==='b-') S.b.s=Math.max(0,S.b.s-1);
  else if (a[0]==='p' && a.length===2) S.p = +a[1];
  else if (a==='go'){
    var l = left();
    if (S.t.run) { if (S.pp.team) S.pp.base = ppLeft(); S.t = {base:l,run:false,at:0}; }
    else { S.t = {base:l,run:true,at:n}; S.pp.at = n; }
  }
  else if (a==='set'){ var v = parseT(document.getElementById('tm').value); if (v===null) return;
    if (S.t.run && S.pp.team) S.pp.base = ppLeft(); S.t = {base:v,run:false,at:0}; }
  else if (a==='ppa' || a==='ppb'){ var d = parseT(document.getElementById('pd').value); if (d===null) return;
    S.pp = {team:a[2], base:d, at:n}; }
  else if (a==='ppx') S.pp = {team:'',base:0,at:0};
  render(); send();
}

function msg(t){ net = t; var e = document.getElementById('msg'); if (e) e.textContent = 'Связь: ' + t; }

function send(){
  fetch(BASE + topic, {method:'POST', body: JSON.stringify(S)})
    .then(function(r){ msg(r.ok ? 'ок' : 'ошибка ' + r.status); })
    .catch(function(){ msg('нет связи, счёт не отправлен'); });
}

function upload(k, f){
  if (!f) return;
  var r = new FileReader();
  r.onload = function(){ var im = new Image(); im.onload = function(){
    var m = 100, d;
    do {
      var sc = Math.min(1, m/Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(im.width*sc)); c.height = Math.max(1, Math.round(im.height*sc));
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      d = c.toDataURL('image/png'); m -= 15;
    } while (d.length > 24000 && m > 30);
    var id = Math.random().toString(36).slice(2, 8);
    LGD[id] = d; S[k].k = 'own'; S[k].lid = id; render();
    var parts = []; for (var i=0; i<d.length; i+=2800) parts.push(d.slice(i, i+2800));
    msg('отправка логотипа…');
    var p = Promise.resolve();
    parts.forEach(function(x, i){ p = p.then(function(){
      return fetch(BASE + topic, {method:'POST', body: JSON.stringify({lg:1, id:id, i:i, n:parts.length, d:x})}).then(function(r){ if(!r.ok) throw 0; });
    }); });
    p.then(function(){ send(); }).catch(function(){ msg('логотип не отправился'); });
  }; im.onerror = function(){ msg('не удалось прочитать картинку'); }; im.src = r.result; };
  r.readAsDataURL(f);
}

function typing(){ var e = document.activeElement; return ctl && e && (e.tagName==='INPUT' || e.tagName==='SELECT'); }

function listen(){
  var es = new EventSource(BASE + topic + '/sse?since=all');
  es.onopen = function(){ msg('ок'); };
  es.onerror = function(){ msg('переподключение…'); };
  es.onmessage = function(ev){
    try {
      var d = JSON.parse(ev.data);
      if (d.event !== 'message') return;
      var n = JSON.parse(d.message);
      if (n && n.lg) { var o = CH[n.id] || (CH[n.id] = {p:[], c:0, n:n.n}); if (!o.p[n.i]) { o.p[n.i] = n.d; o.c++; } if (o.c === o.n) { LGD[n.id] = o.p.join(''); if (!typing()) render(); } return; }
      if (n && n.a && n.b && n.pp) { S = n; if (!typing()) render(); }
    } catch (e) {}
  };
}

render();
if (topic) listen();
setInterval(function(){
  document.querySelectorAll('.clk').forEach(function(e){ e.textContent = fmt(left()); });
  document.querySelectorAll('.ppt').forEach(function(e){ e.textContent = fmtpp(ppLeft()); });
  if (topic && (!ctl || !typing()) && (!!S.pp.team && ppLeft()>0) !== vis) render();
}, 500);
</script>
</body>
</html>
